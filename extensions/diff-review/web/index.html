<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Pi Diff Review</title>
	<link rel="stylesheet" href="/style.css">
</head>
<body>
	<div class="app-shell">
		<header class="topbar">
			<div>
				<h1>Pi Diff Review</h1>
				<p id="subtitle">Loading diff…</p>
			</div>
			<div class="actions">
				<button id="cancelButton" class="secondary" type="button">Cancel</button>
				<button id="submitButton" class="primary" type="button" disabled>Submit comments</button>
			</div>
		</header>

		<main class="main-layout">
			<aside class="sidebar">
				<div class="panel-title">Files</div>
				<div id="fileList" class="file-list"></div>
				<div class="panel-title comments-title">Comments <span id="commentCount">0</span></div>
				<div id="commentList" class="comment-list empty">No comments yet. Click a diff line to add one.</div>
			</aside>

			<section class="diff-pane" id="diffPane">
				<div class="loading">Loading…</div>
			</section>
		</main>
	</div>

	<div id="toast" class="toast" hidden></div>
	<script src="/app.js" defer></script>
</body>
</html>
